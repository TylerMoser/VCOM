<svg xmlns="http://www.w3.org/2000/svg" width="64" height="28" viewBox="0 0 64 28">
  <!-- A floor in the floor selector's stack: the front edges of a sheet like
       floor_top.svg's, all that shows of it under the sheet above. Its sides
       slope as that sheet's lower sides do. White, so FloorSelector tints it;
       the outline stays dark. -->
  <polygon points="2,2 32,19 62,2 62,10 32,27 2,10" fill="#ffffff" stroke="#14161c" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
